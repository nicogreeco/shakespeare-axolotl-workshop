base_model: Qwen/Qwen2.5-0.5B-Instruct
adapter: lora
chat_template: tokenizer_default

datasets:
  - path: /inputs/datasets/public-domain/the-cheshire-cat/train.jsonl
    type: chat_template
    roles_to_train: [assistant]
test_datasets:
  - path: /inputs/datasets/public-domain/the-cheshire-cat/validation.jsonl
    type: chat_template
    roles_to_train: [assistant]
train_on_inputs: false

sequence_len: 1024
micro_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 0.00005
max_steps: 120
seed: 42
warmup_steps: 8
eval_strategy: steps
eval_steps: 15
logging_steps: 10
save_strategy: steps
save_steps: 15
save_total_limit: 1
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
early_stopping_patience: 2

bf16: true
gradient_checkpointing: true
optimizer: adamw_torch
dataset_prepared_path: /workspace/prepared
output_dir: /workspace/output

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
